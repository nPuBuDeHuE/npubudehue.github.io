<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="css/style.css">

<body>
    <nav class="section menu_section">
        <div class="container">
            <div data-include="menu.html"></div>
        </div>

    <section class="section slider_section">
        <div class="slides">

            <div class="slide">

    <section class="section discuss_section">
