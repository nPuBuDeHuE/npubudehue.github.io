<div class="discuss_form">
    <p class="df_header h3 grey900">A quick way to discuss details</p>
    <div class="discuss_form__list">
        <div class="form_control form_control__sm w415">
            <label for="">Name</label>
            <input type="text" placeholder="Your name">
        </div>
        <div class="form_control form_control__sm w415">
            <label for="">Phone</label>
            <input type="text" placeholder="Your phone number">
        </div>
        <div class="form_control form_control__sm w415">
            <label for="">Email</label>
            <input type="text" placeholder="Your working email">
        </div>
        <div class="form_control form_control__sm w415">
            <label for="">Message</label>
            <textarea type="text" placeholder="Your message"></textarea>
        </div>

        <div class="form_control_row">
            <input class="discuss_form__list_check" type=checkbox ><span class="text_small grey800">I agree to receive communications from Createx Construction Bureau.</span>
        </div>
        <button class="btn primary">Send request</button>
    </div>
</div>
